name: skillbridge-ai

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillbridge}
      POSTGRES_USER: ${POSTGRES_USER:-skillbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillbridge_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillbridge} -d ${POSTGRES_DB:-skillbridge}" ]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [ skillbridge ]

  redis:
    image: redis:8-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [ skillbridge ]

  redis-livekit:
    image: redis:8-alpine
    command:
      - sh
      - -c
      - exec redis-server --save "" --appendonly no --requirepass "$$LIVEKIT_REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy noeviction
    environment:
      LIVEKIT_REDIS_PASSWORD: ${LIVEKIT_REDIS_PASSWORD:?Set LIVEKIT_REDIS_PASSWORD}
    tmpfs: [ /data ]
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=$$LIVEKIT_REDIS_PASSWORD redis-cli ping" ]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [ skillbridge ]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 8s
      timeout: 5s
      retries: 20
    networks: [ skillbridge ]

  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-skillbridge}
      DATABASE_USER: ${POSTGRES_USER:-skillbridge}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-skillbridge_dev}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-dummy_key_for_startup}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://localhost:4200}
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL:-http://livekit:7880}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/liveness | grep -q UP" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [ skillbridge ]

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"
    networks: [ skillbridge ]

  notifications:
    build:
      context: ./notifications-service
    environment:
      NODE_ENV: production
      PORT: 3100
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379/1
      NOTIFICATIONS_DATABASE_URL: postgresql://${POSTGRES_USER:-skillbridge}:${POSTGRES_PASSWORD:-skillbridge_dev}@postgres:5432/notifications
      EMAIL_DRIVER: ${EMAIL_DRIVER:-log}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      MAIL_FROM: ${MAIL_FROM:-SkillBridge AI <onboarding@resend.dev>}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8088}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3100/health/live >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [ skillbridge ]

  pyspark:
    build:
      context: ./data-engine
      dockerfile: Dockerfile.pyspark
    profiles: [ "data" ]
    environment:
      SPARK_MASTER: ${SPARK_MASTER:-local[*]}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-skillbridge}
      POSTGRES_USER: ${POSTGRES_USER:-skillbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillbridge_dev}
      POSTGRES_JDBC_DRIVER: org.postgresql.Driver
      SPARK_LOCAL_DIR: /tmp/spark-temp
    volumes:
      - ./data-engine:/workspace
    working_dir: /workspace
    command: [ "python", "scripts/test_spark_connection.py" ]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 3g
    networks: [ skillbridge ]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [ "observability" ]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks: [ skillbridge ]

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [ "observability" ]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [ prometheus ]
    networks: [ skillbridge ]

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_RTC_USE_EXTERNAL_IP: ${LIVEKIT_RTC_USE_EXTERNAL_IP:-false}
      LIVEKIT_RTC_NODE_IP: ${LIVEKIT_RTC_NODE_IP:-127.0.0.1}
      LIVEKIT_RTC_ADVERTISE_INTERNAL_IP: ${LIVEKIT_RTC_ADVERTISE_INTERNAL_IP:-true}
      LIVEKIT_RTC_ENABLE_LOOPBACK_CANDIDATE: ${LIVEKIT_RTC_ENABLE_LOOPBACK_CANDIDATE:-true}
      LIVEKIT_RTC_USE_ICE_LITE: ${LIVEKIT_RTC_USE_ICE_LITE:-true}
      NODE_IP: ${NODE_IP:-127.0.0.1}
      REDIS_HOST: redis-livekit:6379
      REDIS_PASSWORD: ${LIVEKIT_REDIS_PASSWORD:?Set LIVEKIT_REDIS_PASSWORD}
    volumes:
      - ./ops/livekit/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis-livekit:
        condition: service_healthy
    ports:
      - "${LIVEKIT_HTTP_PORT:-7880}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"
      - "127.0.0.1:6789:6789"
    networks: [ skillbridge ]

  spark-master:
    build:
      context: ./analytics-service
    container_name: skillbridge-spark-master
    command: [ "/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master" ]
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-skillbridge}
      POSTGRES_USER: ${POSTGRES_USER:-skillbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillbridge_dev}
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./analytics-service/jobs:/app/jobs
      - ./analytics-service/data:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ skillbridge ]

  spark-worker:
    build:
      context: ./analytics-service
    container_name: skillbridge-spark-worker
    command: [ "/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077" ]
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1g
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-skillbridge}
      POSTGRES_USER: ${POSTGRES_USER:-skillbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillbridge_dev}
    ports:
      - "8081:8081"
      - "4040:4040"
    volumes:
      - ./analytics-service/jobs:/app/jobs
      - ./analytics-service/data:/data 
    depends_on:
      spark-master:
        condition: service_started
      postgres:
        condition: service_healthy
    networks: [ skillbridge ]

networks:
  skillbridge:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  grafana_data:



