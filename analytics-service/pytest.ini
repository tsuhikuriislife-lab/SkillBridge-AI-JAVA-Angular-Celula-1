[pytest]
# Descubrimiento de pruebas
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Mismas rutas de import que PYTHONPATH en docker-compose (/app/jobs:/app)
pythonpath = jobs .

# Resumen de fallos/saltos para ejecución headless (CI o contenedor).
# Sin caché de pytest: en la imagen /app no es escribible por el usuario spark.
addopts = -ra --strict-markers -p no:cacheprovider
