app:
  jwt:
    secret: "aA1!test-jwt-secret-with-sufficient-entropy-and-length-12345"
    expiration-minutes: 60
  security:
    cookie:
      name: access_token
      secure: false
      same-site: Lax
      path: /api
    require-https: false
  cors:
    allowed-origins: http://localhost:8088,http://localhost:4200
  livekit:
    url: ${LIVEKIT_URL:-http://livekit:7880}
    api-key: ${LIVEKIT_API_KEY}
    api-secret: ${LIVEKIT_API_SECRET}