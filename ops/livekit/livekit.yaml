port: 7880

# Habilitar exporter de métricas Prometheus para observabilidad
prometheus:
  port: 6789

# Config motor WebRTC
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  node_ip: "127.0.0.1"
  advertise_internal_ip: true
  enable_loopback_candidate: true
  use_ice_lite: true
  allow_tcp_fallback: true

# Receptor de webhooks hacia el backend (HU-29.3)
webhook:
  api_key: devkey
  urls:
    - "http://backend:8080/api/webhooks/livekit"

logging:
  json: false
  level: info

